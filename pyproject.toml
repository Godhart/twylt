[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "twylt"
version = "1.1.1"
description = "Python reference implementation of TWYLT, a contract for self-describing executable tools."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["pydantic>=2.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/twylt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
